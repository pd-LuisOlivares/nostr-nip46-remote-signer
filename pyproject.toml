[build-system]
requires = ["setuptools==84.2.1"]
build-backend = "setuptools.build_meta"

[project]
name = "nostr-nip46-remote-signer"
version = "0.1.0"
description = "Firmante remoto Nostr (NIP-46) con autenticacion en Stacker News."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi==0.165.0",
    "uvicorn==0.54.0",
    # Nucleo Nostr (Fase 1.0B, D-1): versiones validadas en el laboratorio de la Fase 1.0A.
    "coincurve==21.0.0",      # BIP-340 (Schnorr) y ECDH sobre secp256k1 (envuelve libsecp256k1)
    "cryptography==50.0.2",   # ChaCha20 y HKDF (NIP-44), AES-CBC (NIP-04 entrante)
    "websockets==17.4",       # cliente de relay (se usa a partir del Bloque B2)
    # Autenticacion de la API local (decision D-8, reemplaza a D-4): JWT HS256 firmado por el servidor. Sin extra `crypto`.
    "PyJWT==2.15.1",
]

[project.optional-dependencies]
dev = [
    "pytest==9.2.0",
    "httpx==0.28.1",
    # Pruebas E2E con navegador real (solo desarrollo; Apache-2.0). Se usa el Chrome/Edge ya instalado (channel), sin descargar navegadores.
    "playwright==1.64.1",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.setuptools.package-data]
app = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = ["e2e: pruebas de extremo a extremo con navegador real (Playwright) y relay local; se omiten si no hay navegador"]
